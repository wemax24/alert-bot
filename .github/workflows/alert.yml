name: Trade alerts
on:
  schedule:
    - cron: "5 */4 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "livetest, backtest, zec, scalp or ema"
        default: "livetest"
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Live alerts
        if: github.event_name == 'schedule'
        run: python trade_alert_bot_v3.py
      - name: Live test
        if: github.event_name == 'workflow_dispatch' && inputs.job == 'livetest'
        run: python trade_alert_bot_v3.py
        env:
          MODE: test
      - name: Backtest
        if: github.event_name == 'workflow_dispatch' && inputs.job == 'backtest'
        run: python backtest3.py
      - name: ZEC 3-candle backtest
        if: github.event_name == 'workflow_dispatch' && inputs.job == 'zec'
        run: python backtest4.py
      - name: 15m scalping backtest
        if: github.event_name == 'workflow_dispatch' && inputs.job == 'scalp'
        run: python backtest5.py
      - name: 5m EMA cross backtest
        if: github.event_name == 'workflow_dispatch' && inputs.job == 'ema'
        run: python backtest6.py